<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foveated Renderer for Any Scene</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        font-family: "Consolas", "Monaco", monospace;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100vh;
      }
      #debugPanel {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.85);
        color: #0f0;
        padding: 15px;
        border-radius: 8px;
        font-size: 12px;
        z-index: 1000;
        pointer-events: none;
        border: 1px solid rgba(0, 255, 0, 0.3);
        min-width: 320px;
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
      }
      #fileUpload {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 1001;
        pointer-events: all;
      }
      #fileUpload input {
        display: none;
      }
      #fileUpload label {
        background: rgba(0, 255, 0, 0.2);
        color: #0f0;
        padding: 10px 20px;
        border-radius: 5px;
        border: 1px solid #0f0;
        cursor: pointer;
        font-family: "Consolas", monospace;
        transition: all 0.3s;
      }
      #fileUpload label:hover {
        background: rgba(0, 255, 0, 0.4);
      }
      #renderModeToggle {
        position: fixed;
        top: 60px;
        right: 10px;
        z-index: 1001;
        pointer-events: all;
      }
      #renderModeToggle button {
        background: rgba(0, 255, 0, 0.2);
        color: #0f0;
        padding: 10px 20px;
        border-radius: 5px;
        border: 1px solid #0f0;
        cursor: pointer;
        font-family: "Consolas", monospace;
        transition: all 0.3s;
        font-weight: bold;
      }
      #renderModeToggle button:hover {
        background: rgba(0, 255, 0, 0.4);
      }
      #renderModeToggle button.active {
        background: rgba(0, 255, 0, 0.6);
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
      }
      .metric-row {
        display: flex;
        justify-content: space-between;
        margin: 4px 0;
        padding: 3px 0;
      }
      .metric-label {
        color: #888;
      }
      .metric-value {
        color: #0f0;
        font-weight: bold;
      }
      .section-title {
        color: #0ff;
        font-weight: bold;
        margin-top: 10px;
        margin-bottom: 5px;
        border-bottom: 1px solid rgba(0, 255, 255, 0.3);
        padding-bottom: 3px;
      }
      .status-connected {
        color: #0f0;
      }
      .status-disconnected {
        color: #f00;
      }
      .performance-bar {
        height: 4px;
        background: rgba(0, 255, 0, 0.2);
        border-radius: 2px;
        margin-top: 3px;
        overflow: hidden;
      }
      .performance-bar-fill {
        height: 100%;
        background: #0f0;
        transition: width 0.1s;
      }
      #gazeIndicator {
        position: fixed;
        width: 30px;
        height: 30px;
        border: 2px solid #0f0;
        border-radius: 50%;
        background: rgba(0, 255, 0, 0.15);
        pointer-events: none;
        z-index: 999;
        transform: translate(-50%, -50%);
        display: none;
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
      }
      .hotkey {
        color: #ff0;
        font-weight: bold;
      }
      .optimization-gain {
        color: #0f0;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="debugPanel"></div>
    <div id="gazeIndicator"></div>
    <div id="fileUpload">
      <input type="file" id="modelInput" accept=".gltf,.glb,.obj,.fbx" />
      <label for="modelInput">📁 Load Model</label>
    </div>
    <div id="renderModeToggle">
      <button id="toggleButton" class="active">🎯 FOVEATED ON</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
      console.log("Starting Foveated Renderer for Any Scene...");

      const WS_PROTOCOL = "ws";
      const WS_HOST = "localhost";
      const WS_PORT = "8765";
      const WS_URL = `${WS_PROTOCOL}://${WS_HOST}:${WS_PORT}`;
      let ws = null;
      let reconnectAttempts = 0;
      const maxReconnectAttempts = 10;

      let gazeData = {
        x: 0.5,
        y: 0.5,
        confidence: 0.0,
        connected: false,
      };

      let foveatedEnabled = true;
      const RADIUS_FOVEA = 0.25;
      const RADIUS_PARAFOVEA = 0.5;

      const perfSamples = [];
      const PERF_SAMPLE_COUNT = 60;
      let frameTime = 0;
      let fps = 0;
      let totalMeshes = 0;
      let renderedMeshes = 0;
      let skippedMeshes = 0;
      let totalTriangles = 0;
      let renderedTriangles = 0;
      let gpuMemoryUsed = 0;
      let drawCalls = 0;
      let gpuTimeMs = 0;

      const debugPanel = document.getElementById("debugPanel");
      const gazeIndicator = document.getElementById("gazeIndicator");

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);
      scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 2, 8);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // Освещение
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 10, 5);
      scene.add(dirLight);

      // Хранилище для всех объектов сцены
      const sceneObjects = [];
      let loadedModel = null;

      // Создаем тестовую сцену по умолчанию
      function createTestScene() {
        console.log("Creating test scene...");
        
        // Группа для тестовой сцены
        const testGroup = new THREE.Group();
        
        // Центральная сфера
        const sphereGeo = new THREE.SphereGeometry(1, 32, 32);
        const sphereMat = new THREE.MeshStandardMaterial({ 
          color: 0xff6b6b,
          metalness: 0.5,
          roughness: 0.5
        });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.userData.triangleCount = sphereGeo.attributes.position.count / 3;
        testGroup.add(sphere);
        sceneObjects.push(sphere);

        // Кольцо из кубов
        const boxGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        for (let i = 0; i < 12; i++) {
          const angle = (i / 12) * Math.PI * 2;
          const radius = 3;
          const boxMat = new THREE.MeshStandardMaterial({ 
            color: new THREE.Color().setHSL(i / 12, 1, 0.6),
            metalness: 0.3,
            roughness: 0.7
          });
          const box = new THREE.Mesh(boxGeo, boxMat);
          box.position.x = Math.cos(angle) * radius;
          box.position.z = Math.sin(angle) * radius;
          box.position.y = Math.sin(i * 0.5) * 0.5;
          box.rotation.y = angle;
          box.userData.triangleCount = 12; // Куб = 12 треугольников
          testGroup.add(box);
          sceneObjects.push(box);
        }

        // Внешнее кольцо из конусов
        const coneGeo = new THREE.ConeGeometry(0.3, 0.8, 8);
        for (let i = 0; i < 20; i++) {
          const angle = (i / 20) * Math.PI * 2;
          const radius = 5;
          const coneMat = new THREE.MeshStandardMaterial({ 
            color: new THREE.Color().setHSL(i / 20, 0.8, 0.5),
            metalness: 0.2,
            roughness: 0.8
          });
          const cone = new THREE.Mesh(coneGeo, coneMat);
          cone.position.x = Math.cos(angle) * radius;
          cone.position.z = Math.sin(angle) * radius;
          cone.position.y = -0.5;
          cone.userData.triangleCount = coneGeo.attributes.position.count / 3;
          testGroup.add(cone);
          sceneObjects.push(cone);
        }

        // Пол
        const floorGeo = new THREE.PlaneGeometry(20, 20, 10, 10);
        const floorMat = new THREE.MeshStandardMaterial({ 
          color: 0x2c3e50,
          metalness: 0.1,
          roughness: 0.9,
          side: THREE.DoubleSide
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -2;
        floor.userData.triangleCount = floorGeo.attributes.position.count / 3;
        testGroup.add(floor);
        sceneObjects.push(floor);

        scene.add(testGroup);
        loadedModel = testGroup;
        
        totalMeshes = sceneObjects.length;
        totalTriangles = sceneObjects.reduce((sum, obj) => 
          sum + (obj.userData.triangleCount || 0), 0
        );
        
        console.log(`Test scene created: ${totalMeshes} meshes, ${totalTriangles} triangles`);
      }

      createTestScene();

      // Функция для получения экранной позиции объекта
      function getScreenPosition(object) {
        const vector = new THREE.Vector3();
        object.getWorldPosition(vector);
        vector.project(camera);
        
        return {
          x: (vector.x + 1) / 2,
          y: (-vector.y + 1) / 2,
          z: vector.z
        };
      }

      // Функция для вычисления расстояния от объекта до точки взгляда
      function getDistanceToGaze(object) {
        const pos = getScreenPosition(object);
        
        // Если объект за камерой, возвращаем большое значение
        if (pos.z > 1) return 999;
        
        const dx = pos.x - gazeData.x;
        const dy = pos.y - gazeData.y;
        return Math.sqrt(dx * dx + dy * dy);
      }

      // Основная функция фовеального рендеринга
      function updateFoveatedRendering() {
        if (!foveatedEnabled) {
          // Без оптимизации - показываем всё
          sceneObjects.forEach(obj => {
            obj.visible = true;
            if (obj.material) {
              obj.material.wireframe = false;
            }
          });
          renderedMeshes = totalMeshes;
          skippedMeshes = 0;
          renderedTriangles = totalTriangles;
          return;
        }

        renderedMeshes = 0;
        skippedMeshes = 0;
        renderedTriangles = 0;

        sceneObjects.forEach(obj => {
          const dist = getDistanceToGaze(obj);
          
          if (dist < RADIUS_FOVEA) {
            // ФОВЕА: полное качество
            obj.visible = true;
            if (obj.material) {
              obj.material.wireframe = false;
              obj.material.opacity = 1;
              obj.material.transparent = false;
            }
            renderedMeshes++;
            renderedTriangles += obj.userData.triangleCount || 0;
            
          } else if (dist < RADIUS_PARAFOVEA) {
            // ПАРАФОВЕА: вайрфрейм или упрощенный рендер
            obj.visible = true;
            if (obj.material) {
              obj.material.wireframe = true;
              obj.material.opacity = 0.5;
              obj.material.transparent = true;
            }
            renderedMeshes++;
            renderedTriangles += (obj.userData.triangleCount || 0) * 0.1; // Вайрфрейм ~10% нагрузки
            
          } else {
            // ПЕРИФЕРИЯ: не рендерим совсем
            obj.visible = false;
            skippedMeshes++;
          }
        });
      }

      function updatePerformanceMeasures(renderStart, renderEnd) {
        const ms = renderEnd - renderStart;
        frameTime = ms;
        perfSamples.push(ms);
        if (perfSamples.length > PERF_SAMPLE_COUNT) perfSamples.shift();

        const sum = perfSamples.reduce((a, b) => a + b, 0);
        const avg = sum / perfSamples.length;
        fps = 1000 / (avg || 16.67);
        
        // GPU метрики из renderer.info
        const info = renderer.info;
        drawCalls = info.render.calls;
        
        // Приблизительная оценка нагрузки на GPU
        // Базируется на количестве треугольников и draw calls
        gpuTimeMs = (renderedTriangles / 1000) * 0.01 + drawCalls * 0.05;
        
        // Оценка использования GPU памяти (MB)
        gpuMemoryUsed = (info.memory.geometries * 0.5 + info.memory.textures * 2);
      }

      function updateDebugInfo() {
        const connected = gazeData.connected;
        const conf = gazeData.confidence;

        const avgFrame = perfSamples.length
          ? (perfSamples.reduce((a, b) => a + b, 0) / perfSamples.length).toFixed(2)
          : "0";

        const fpsPercent = Math.min((fps / 60) * 100, 100);
        const renderPercent = totalMeshes > 0 ? (renderedMeshes / totalMeshes) * 100 : 0;
        const trianglePercent = totalTriangles > 0 ? (renderedTriangles / totalTriangles) * 100 : 0;
        const optimization = totalMeshes > 0 ? ((skippedMeshes / totalMeshes) * 100).toFixed(1) : "0";

        debugPanel.innerHTML = `
        <div class="section-title">🔌 CONNECTION</div>
        <div class="metric-row">
          <span class="metric-label">WebSocket:</span>
          <span class="metric-value ${connected ? "status-connected" : "status-disconnected"}">
            ${connected ? "✓ Connected" : "✗ Disconnected"}
          </span>
        </div>
        
        <div class="section-title">👁️ GAZE</div>
        <div class="metric-row">
          <span class="metric-label">Position:</span>
          <span class="metric-value">(${gazeData.x.toFixed(3)}, ${gazeData.y.toFixed(3)})</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Confidence:</span>
          <span class="metric-value">${(conf * 100).toFixed(1)}%</span>
        </div>
        <div class="performance-bar">
          <div class="performance-bar-fill" style="width: ${conf * 100}%"></div>
        </div>
        
        <div class="section-title">⚡ PERFORMANCE</div>
        <div class="metric-row">
          <span class="metric-label">FPS:</span>
          <span class="metric-value">${Math.round(fps)} fps</span>
        </div>
        <div class="performance-bar">
          <div class="performance-bar-fill" style="width: ${fpsPercent}%"></div>
        </div>
        <div class="metric-row">
          <span class="metric-label">Frame Time:</span>
          <span class="metric-value">${frameTime.toFixed(2)} ms (avg: ${avgFrame})</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Draw Calls:</span>
          <span class="metric-value">${drawCalls}</span>
        </div>
        
        <div class="section-title">🖥️ GPU LOAD</div>
        <div class="metric-row">
          <span class="metric-label">GPU Time:</span>
          <span class="metric-value">${gpuTimeMs.toFixed(2)} ms</span>
        </div>
        <div class="performance-bar">
          <div class="performance-bar-fill" style="width: ${Math.min((gpuTimeMs / 16.67) * 100, 100)}%"></div>
        </div>
        <div class="metric-row">
          <span class="metric-label">GPU Utilization:</span>
          <span class="metric-value">${Math.min(((gpuTimeMs / 16.67) * 100), 100).toFixed(1)}%</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">VRAM Usage:</span>
          <span class="metric-value">${gpuMemoryUsed.toFixed(1)} MB</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Geometries:</span>
          <span class="metric-value">${renderer.info.memory.geometries}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Textures:</span>
          <span class="metric-value">${renderer.info.memory.textures}</span>
        </div>
        
        <div class="section-title">🎨 RENDERING MODE</div>
        <div class="metric-row">
          <span class="metric-label">Current Mode:</span>
          <span class="metric-value">${foveatedEnabled ? "🎯 FOVEATED" : "👁️ FULL SCENE"}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Status:</span>
          <span class="metric-value">${foveatedEnabled ? "Optimizing based on gaze" : "Rendering everything"}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Meshes:</span>
          <span class="metric-value">${renderedMeshes} / ${totalMeshes}</span>
        </div>
        <div class="performance-bar">
          <div class="performance-bar-fill" style="width: ${renderPercent}%"></div>
        </div>
        <div class="metric-row">
          <span class="metric-label">Triangles:</span>
          <span class="metric-value">${Math.round(renderedTriangles).toLocaleString()} / ${totalTriangles.toLocaleString()}</span>
        </div>
        <div class="performance-bar">
          <div class="performance-bar-fill" style="width: ${trianglePercent}%"></div>
        </div>
        <div class="metric-row">
          <span class="metric-label">Optimization:</span>
          <span class="metric-value optimization-gain">${foveatedEnabled ? optimization + "% saved" : "0% (Full render)"}</span>
        </div>
        
        <div class="section-title">⌨️ CONTROLS</div>
        <div class="metric-row">
          <span class="metric-label"><span class="hotkey">F</span> - Toggle Foveated</span>
        </div>
        <div class="metric-row">
          <span class="metric-label"><span class="hotkey">R</span> - Reconnect WS</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Mouse - Rotate Scene</span>
        </div>
      `;

        if (connected && conf > 0.2) {
          gazeIndicator.style.display = "block";
          gazeIndicator.style.left = `${gazeData.x * window.innerWidth}px`;
          gazeIndicator.style.top = `${gazeData.y * window.innerHeight}px`;
        } else {
          gazeIndicator.style.display = "none";
        }
      }

      function connectWebSocket() {
        try {
          ws = new WebSocket(WS_URL);

          ws.onopen = () => {
            console.log("✓ Connected to gaze tracking server");
            gazeData.connected = true;
            reconnectAttempts = 0;
          };

          ws.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              gazeData.x = data.x;
              gazeData.y = data.y;
              gazeData.confidence = data.confidence || 0.0;
            } catch (e) {
              console.error("Error parsing gaze data:", e);
            }
          };

          ws.onerror = (error) => {
            gazeData.connected = false;
          };

          ws.onclose = (event) => {
            gazeData.connected = false;
            if (event.code !== 1000 && reconnectAttempts < maxReconnectAttempts) {
              reconnectAttempts++;
              const delay = Math.min(2000 * reconnectAttempts, 10000);
              setTimeout(connectWebSocket, delay);
            }
          };
        } catch (error) {
          console.error("Failed to create WebSocket:", error);
          gazeData.connected = false;
        }
      }

      // Управление мышью
      let mouseDown = false;
      let mouseX = 0;
      let mouseY = 0;
      let targetRotationX = 0;
      let targetRotationY = 0;
      let rotationX = 0;
      let rotationY = 0;

      document.addEventListener("mousedown", (e) => {
        mouseDown = true;
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      document.addEventListener("mouseup", () => {
        mouseDown = false;
      });

      document.addEventListener("mousemove", (e) => {
        if (mouseDown) {
          const deltaX = e.clientX - mouseX;
          const deltaY = e.clientY - mouseY;
          targetRotationY += deltaX * 0.005;
          targetRotationX += deltaY * 0.005;
          mouseX = e.clientX;
          mouseY = e.clientY;
        }
      });

      document.addEventListener("wheel", (e) => {
        camera.position.z += e.deltaY * 0.01;
        camera.position.z = Math.max(2, Math.min(camera.position.z, 30));
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "f" || e.key === "F") {
          foveatedEnabled = !foveatedEnabled;
          console.log("Foveated rendering:", foveatedEnabled);
        } else if (e.key === "r" || e.key === "R") {
          console.log("Manual reconnect...");
          reconnectAttempts = 0;
          if (ws) ws.close();
          connectWebSocket();
        }
      });

      // Загрузка моделей
      const gltfLoader = new THREE.GLTFLoader();
      
      document.getElementById("modelInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        console.log("Loading model:", file.name);
        
        const reader = new FileReader();
        reader.onload = (event) => {
          const arrayBuffer = event.target.result;
          
          // Очищаем старую сцену
          if (loadedModel) {
            scene.remove(loadedModel);
            sceneObjects.length = 0;
          }
          
          // Загружаем новую модель
          gltfLoader.parse(arrayBuffer, '', (gltf) => {
            console.log("Model loaded successfully!");
            loadedModel = gltf.scene;
            scene.add(loadedModel);
            
            // Центрируем и масштабируем модель
            const box = new THREE.Box3().setFromObject(loadedModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 5 / maxDim;
            loadedModel.scale.setScalar(scale);
            
            loadedModel.position.x = -center.x * scale;
            loadedModel.position.y = -center.y * scale;
            loadedModel.position.z = -center.z * scale;
            
            // Собираем все меши
            loadedModel.traverse((child) => {
              if (child.isMesh) {
                sceneObjects.push(child);
                
                // Подсчитываем треугольники
                if (child.geometry && child.geometry.attributes.position) {
                  child.userData.triangleCount = child.geometry.attributes.position.count / 3;
                }
                
                // Убеждаемся что материалы корректны
                if (child.material) {
                  if (Array.isArray(child.material)) {
                    child.material.forEach(mat => {
                      mat.side = THREE.DoubleSide;
                    });
                  } else {
                    child.material.side = THREE.DoubleSide;
                  }
                }
              }
            });
            
            totalMeshes = sceneObjects.length;
            totalTriangles = sceneObjects.reduce((sum, obj) => 
              sum + (obj.userData.triangleCount || 0), 0
            );
            
            console.log(`Loaded: ${totalMeshes} meshes, ${totalTriangles.toFixed(0)} triangles`);
            
            // Настраиваем камеру
            camera.position.set(0, 2, 8);
            camera.lookAt(0, 0, 0);
            
          }, (error) => {
            console.error("Error loading model:", error);
            alert("Error loading model. Make sure it's a valid GLTF/GLB file.");
          });
        };
        
        reader.readAsArrayBuffer(file);
      });

      // Кнопка переключения режима рендеринга
      const toggleButton = document.getElementById("toggleButton");
      
      toggleButton.addEventListener("click", () => {
        foveatedEnabled = !foveatedEnabled;
        
        if (foveatedEnabled) {
          toggleButton.textContent = "🎯 FOVEATED ON";
          toggleButton.classList.add("active");
          console.log("✓ Foveated rendering ENABLED - Objects outside gaze will be culled");
        } else {
          toggleButton.textContent = "👁️ FULL RENDER";
          toggleButton.classList.remove("active");
          console.log("✗ Foveated rendering DISABLED - Rendering entire scene");
        }
      });

      function animate() {
        requestAnimationFrame(animate);

        if (loadedModel) {
          rotationX += (targetRotationX - rotationX) * 0.1;
          rotationY += (targetRotationY - rotationY) * 0.1;
          loadedModel.rotation.x = rotationX;
          loadedModel.rotation.y = rotationY;

          if (!mouseDown) {
            loadedModel.rotation.y += 0.005;
          }
        }

        const t0 = performance.now();

        updateFoveatedRendering();
        renderer.render(scene, camera);

        const t1 = performance.now();

        updatePerformanceMeasures(t0, t1);
        updateDebugInfo();
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();

      setTimeout(() => {
        connectWebSocket();
      }, 1000);
    </script>
  </body>
</html>
